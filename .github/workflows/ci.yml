name: CI - Analyze & Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.32.0'

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies (local packages first)
        run: |
          for package_dir in packages/*/; do
            if [ -f "$package_dir/pubspec.yaml" ]; then
              echo "pub get for $package_dir"
              (cd "$package_dir" && flutter pub get)
            fi
          done
          flutter pub get

      - name: Analyze
        # infos/warnings are non-fatal: the pristine DiaryVault base already
        # carries some; errors always fail the build.
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test
