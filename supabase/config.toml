# DearCocoa - configurazione Supabase locale (Supabase CLI)
# Uso: supabase start  (dev locale)  |  supabase db push  (applica migrations)
project_id = "dearcocoa"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://dearcocoa.app"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true
email_confirm = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

# Realtime: rooms/messages sono pubblicate in 0001_init.sql via publication

[functions.reflections]
verify_jwt = true
